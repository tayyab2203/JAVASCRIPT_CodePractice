<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to Start</h2>
    <div class="btn-container">
      <div class="row1">
        <div class="btn color1" type="button">1</div>
        <div class="btn color2" type="button">2</div>
      </div>
      <div class="row2">
          <div class="btn color3" type="button">3</div>
          <div class="btn color4" type="button">4</div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
